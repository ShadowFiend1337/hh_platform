<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="406"
     viewBox="0 0 720 406"
     font-family="Manrope, 'Segoe UI', Arial, sans-serif"
     role="img"
     aria-label="Уточняющий блок снижает ошибочные подтверждения">

  <rect
    x="0.5"
    y="0.5"
    width="719"
    height="405"
    rx="14"
    fill="#fff"
    stroke="#e6e8ee"
  />

  <text
    x="28"
    y="40"
    font-size="19"
    font-weight="700"
    fill="#1d2129">
    Уточняющий блок снижает ошибочные подтверждения
  </text>

  <text
    x="28"
    y="64"
    font-size="13"
    fill="#626875">
    Решение «подтверждён / нет» против истинного уровня; блок из 6 вопросов получают 16% попыток с баллом 70–79 (9 из 12)
  </text>

  <!-- Легенда -->
  <rect x="28" y="80" width="12" height="12" rx="3" fill="#b9bec9"/>
  <text x="46" y="90" font-size="12.5" fill="#1d2129">12 вопросов</text>

  <rect x="218" y="80" width="12" height="12" rx="3" fill="#006ce8"/>
  <text x="236" y="90" font-size="12.5" fill="#1d2129">С уточняющим блоком</text>

  <!-- Сетка -->
  <line x1="56" x2="696" y1="332" y2="332" stroke="#e6e8ee"/>
  <text x="48" y="336" font-size="11" text-anchor="end" fill="#626875">0%</text>

  <line x1="56" x2="696" y1="279.5" y2="279.5" stroke="#e6e8ee"/>
  <text x="48" y="283.5" font-size="11" text-anchor="end" fill="#626875">25%</text>

  <line x1="56" x2="696" y1="227" y2="227" stroke="#e6e8ee"/>
  <text x="48" y="231" font-size="11" text-anchor="end" fill="#626875">50%</text>

  <line x1="56" x2="696" y1="174.5" y2="174.5" stroke="#e6e8ee"/>
  <text x="48" y="178.5" font-size="11" text-anchor="end" fill="#626875">75%</text>

  <line x1="56" x2="696" y1="122" y2="122" stroke="#e6e8ee"/>
  <text x="48" y="126" font-size="11" text-anchor="end" fill="#626875">100%</text>

  <!-- 1. Точность решения -->
  <rect
    x="106"
    y="128.3"
    width="28"
    height="203.7"
    rx="4"
    fill="#b9bec9"
  />
  <text
    x="120"
    y="122.3"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    97
  </text>

  <rect
    x="138"
    y="128.3"
    width="28"
    height="203.7"
    rx="4"
    fill="#006ce8"
  />
  <text
    x="152"
    y="122.3"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    97
  </text>

  <text
    x="136"
    y="354"
    font-size="12.5"
    text-anchor="middle"
    fill="#1d2129">
    Точность решения
  </text>

  <!-- 2. Ошибочно не утвержден -->
  <rect
    x="266"
    y="325.7"
    width="28"
    height="6.3"
    rx="4"
    fill="#b9bec9"
  />
  <text
    x="280"
    y="319.7"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    3
  </text>

  <rect
    x="298"
    y="321.5"
    width="28"
    height="10.5"
    rx="4"
    fill="#006ce8"
  />
  <text
    x="312"
    y="315.5"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    5
  </text>

  <text
    x="296"
    y="354"
    font-size="12.5"
    text-anchor="middle"
    fill="#1d2129">
    Ошибочно не утвержден
  </text>

  <!-- 3. Ошибочно подтверждены -->
  <rect
    x="426"
    y="323.6"
    width="28"
    height="8.4"
    rx="4"
    fill="#b9bec9"
  />
  <text
    x="440"
    y="317.6"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    4
  </text>

  <rect
    x="458"
    y="332"
    width="28"
    height="0"
    rx="4"
    fill="#006ce8"
  />
  <text
    x="472"
    y="326"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    0
  </text>

  <text
    x="456"
    y="354"
    font-size="12.5"
    text-anchor="middle"
    fill="#1d2129">
    Ошибочно подтверждены
  </text>

  <!-- 4. Совпадение при пересдаче -->
  <rect
    x="586"
    y="143"
    width="28"
    height="189"
    rx="4"
    fill="#b9bec9"
  />
  <text
    x="600"
    y="137"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    90
  </text>

  <rect
    x="618"
    y="143"
    width="28"
    height="189"
    rx="4"
    fill="#006ce8"
  />
  <text
    x="632"
    y="137"
    font-size="11.5"
    font-weight="600"
    text-anchor="middle"
    fill="#1d2129">
    90
  </text>

  <text
    x="616"
    y="354"
    font-size="12.5"
    text-anchor="middle"
    fill="#1d2129">
    Совпадение при пересдаче
  </text>

  <text
    x="28"
    y="388"
    font-size="11.5"
    fill="#626875">
    реальные люди
  </text>

</svg>
